services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: restaurant_bookings
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 30s
    networks:
      - my_network

  backend:
    image: server:2.1
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db:3306
      - DB_USER=root
      - DB_PASSWORD=123
      - DB_NAME=restaurant_bookings
    stdin_open: true
    tty: true
   
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network

  frontend:
    build: ./client
    ports:
      - "3000:3000" 
    stdin_open: true
    tty: true
    depends_on:
      - backend

networks:
  my_network:
    driver: bridge

volumes:
  db_data: 
    driver: local